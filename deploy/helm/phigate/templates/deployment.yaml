apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phigate.fullname" . }}
  labels: {{- include "phigate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "phigate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "phigate.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        # Roll pods when the credential secret changes, so a key rotation
        # actually takes effect instead of waiting for the next unrelated deploy.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: phigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PHIGATE_ADDR
              value: ":8080"

            # --- backends ---
            - name: PHIGATE_LOCAL_PROVIDER
              value: {{ .Values.backends.local.provider | quote }}
            - name: PHIGATE_LOCAL_BASE_URL
              value: {{ .Values.backends.local.baseUrl | quote }}
            - name: PHIGATE_LOCAL_MODEL
              value: {{ .Values.backends.local.model | quote }}
            - name: PHIGATE_CLOUD_PROVIDER
              value: {{ .Values.backends.cloud.provider | quote }}
            - name: PHIGATE_CLOUD_BASE_URL
              value: {{ .Values.backends.cloud.baseUrl | quote }}
            - name: PHIGATE_CLOUD_MODEL
              value: {{ .Values.backends.cloud.model | quote }}
            {{- with .Values.backends.cloud.apiVersion }}
            - name: PHIGATE_CLOUD_API_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.backends.cloud.deployment }}
            - name: PHIGATE_CLOUD_DEPLOYMENT
              value: {{ . | quote }}
            {{- end }}

            # --- credentials ---
            - name: PHIGATE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "phigate.secretName" . }}
                  key: PHIGATE_API_KEYS
            - name: PHIGATE_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "phigate.secretName" . }}
                  key: PHIGATE_CLOUD_API_KEY

            # --- egress policy ---
            - name: PHIGATE_CLOUD_MAX_SENSITIVITY
              value: {{ .Values.policy.cloudMaxSensitivity | quote }}
            {{- with .Values.policy.denyAboveSensitivity }}
            - name: PHIGATE_DENY_ABOVE_SENSITIVITY
              value: {{ . | quote }}
            {{- end }}
            - name: PHIGATE_ALLOW_CLOUD_FALLBACK
              value: {{ .Values.policy.allowCloudFallback | quote }}

            # --- redaction ---
            {{- with .Values.redaction.packs }}
            - name: PHIGATE_REDACT_PACKS
              value: {{ . | quote }}
            {{- end }}
            - name: PHIGATE_INTERNAL_DOMAINS
              value: {{ .Values.redaction.internalDomains | quote }}
            - name: PHIGATE_REDACT_DISABLE_ENTROPY
              value: {{ .Values.redaction.disableEntropy | quote }}
            {{- with .Values.redaction.disableRules }}
            - name: PHIGATE_REDACT_DISABLE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.redaction.customRulesConfigMap }}
            - name: PHIGATE_REDACT_RULE_DIR
              value: /etc/phigate/rules
            {{- end }}

            # --- guardrails ---
            {{- with .Values.guard.severityOverrides }}
            - name: PHIGATE_GUARD_SEVERITY
              value: {{ . | quote }}
            {{- end }}
            - name: PHIGATE_INGRESS_SCAN
              value: {{ .Values.guard.ingressScan | quote }}

            # --- cache and sessions ---
            - name: PHIGATE_CACHE_ENABLED
              value: {{ .Values.cache.enabled | quote }}
            - name: PHIGATE_CACHE_TTL
              value: {{ .Values.cache.ttl | quote }}
            - name: PHIGATE_CACHE_MAX
              value: {{ .Values.cache.max | quote }}
            - name: PHIGATE_SESSION_TTL
              value: {{ .Values.session.ttl | quote }}
            - name: PHIGATE_SESSION_MAX
              value: {{ .Values.session.max | quote }}

            # --- accounting ---
            {{- if .Values.pricing.configMap }}
            - name: PHIGATE_PRICE_BOOK
              value: /etc/phigate/pricing/price-book.json
            {{- end }}
            - name: PHIGATE_LOCAL_COST_PER_MTOK
              value: {{ .Values.pricing.localCostPerMTok | quote }}

            # --- observability ---
            {{- with .Values.observability.auditLog }}
            - name: PHIGATE_AUDIT_LOG
              value: {{ . | quote }}
            {{- end }}
            - name: PHIGATE_DASHBOARD
              value: {{ .Values.observability.dashboard | quote }}
            - name: PHIGATE_DEBUG
              value: {{ .Values.observability.debug | quote }}

            # --- serving ---
            - name: PHIGATE_RATE_LIMIT_PER_MIN
              value: {{ .Values.serving.rateLimitPerMin | quote }}
            - name: PHIGATE_RATE_LIMIT_BURST
              value: {{ .Values.serving.rateLimitBurst | quote }}
            - name: PHIGATE_MAX_BODY_BYTES
              value: {{ .Values.serving.maxBodyBytes | quote }}
            - name: PHIGATE_SHUTDOWN_GRACE
              value: {{ .Values.serving.shutdownGrace | quote }}
            - name: PHIGATE_UPSTREAM_RETRIES
              value: {{ .Values.serving.upstreamRetries | quote }}
            {{- with .Values.serving.trustedProxyHeader }}
            - name: PHIGATE_TRUSTED_PROXY_HEADER
              value: {{ . | quote }}
            {{- end }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            # /readyz probes the upstream backends, so it is slower and more
            # tolerant than liveness: a briefly unreachable cloud provider
            # should stop traffic, not restart the pod.
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4

          resources: {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.observability.auditLog }}
            # The root filesystem is read-only, so a configured audit log needs
            # a writable mount at its directory. Without this the pod starts,
            # fails to open the file, and crash-loops.
            - name: audit
              mountPath: {{ .Values.observability.auditLog | dir | quote }}
            {{- end }}
            {{- if .Values.redaction.customRulesConfigMap }}
            - name: custom-rules
              mountPath: /etc/phigate/rules
              readOnly: true
            {{- end }}
            {{- if .Values.pricing.configMap }}
            - name: pricing
              mountPath: /etc/phigate/pricing
              readOnly: true
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.observability.auditLog }}
        - name: audit
          {{- toYaml .Values.observability.auditVolume | nindent 10 }}
        {{- end }}
        {{- if .Values.redaction.customRulesConfigMap }}
        - name: custom-rules
          configMap:
            name: {{ .Values.redaction.customRulesConfigMap }}
        {{- end }}
        {{- if .Values.pricing.configMap }}
        - name: pricing
          configMap:
            name: {{ .Values.pricing.configMap }}
        {{- end }}

      # Long enough for in-flight streaming completions to finish; a killed
      # stream still bills the upstream request.
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
