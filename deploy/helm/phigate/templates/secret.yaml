{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phigate.fullname" . }}
  labels: {{- include "phigate.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PhiGate refuses to start with no client credentials unless anonymous access
  # is explicitly chosen: an unauthenticated gateway in front of a billed API
  # key is an open relay.
  PHIGATE_API_KEYS: {{ required "secrets.apiKeys is required (or set secrets.existingSecret). PhiGate must not run unauthenticated." .Values.secrets.apiKeys | quote }}
  PHIGATE_CLOUD_API_KEY: {{ .Values.secrets.cloudApiKey | quote }}
{{- end }}
