name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  guarantees:
    name: security guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # These are the product's claims. They get their own job so a failure is
      # unmistakable in the checks list rather than buried in a test summary.
      - name: No sensitive value survives redaction
        run: go test -v -count=1 ./internal/redact/ -run 'TestLeakCorpus|TestRedactIsSinglePass|TestMyNumber'

      - name: Egress policy never falls back for confined data
        run: go test -v -count=1 ./internal/policy/

      - name: Guard blocks catastrophic commands and does not block prose
        run: go test -v -count=1 ./internal/sandbox/ -run 'TestGuardBlocks|TestGuardBypasses|TestGuardDoesNotBlockProse'

      - name: Cache does not leak across sessions
        run: go test -v -count=1 ./internal/gateway/ -run 'TestTemplateCache|TestPolicyForbids|TestDebugEndpoint|TestAuthentication'

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Pinned deliberately. `version: latest` on action@v6 resolved to the
      # golangci-lint v1 line, which predates this module's Go toolchain and
      # failed to type-check the code — a CI failure caused by the calendar
      # rather than by the commit. An explicit version makes lint results a
      # function of the repository, not of the day the job ran.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # PhiGate terminates TLS on its listener and initiates TLS to upstream
      # providers, so standard-library TLS/HTTP/x509 advisories apply directly
      # to it. This job is the reason go.mod sets a Go floor rather than a
      # minimum language version: an older toolchain builds a binary with a
      # known-vulnerable stdlib, and that binary is what ships in the image.
      - name: Scan dependencies and stdlib for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: phigate:ci
