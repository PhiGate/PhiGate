# golangci-lint configuration.
#
# This file exists mainly to pin the schema version. Without it, the CI action's
# `version: latest` resolved to the golangci-lint v1 line, which predates the Go
# toolchain this module requires and fails to type-check the code. Pinning both
# the schema here and an explicit linter version in CI makes lint results
# reproducible instead of a function of when the job happened to run.
version: "2"

run:
  timeout: 5m
  # tree-sitter needs cgo, so the linter must build with it enabled or every
  # file importing the bindings fails to type-check.
  build-tags: []

linters:
  # The default set (errcheck, govet, ineffassign, staticcheck, unused) is
  # deliberately kept. PhiGate's correctness guarantees are enforced by tests
  # that assert behaviour, not by a broad linter set that mostly produces style
  # noise a contributor has to argue with.
  default: standard

  exclusions:
    rules:
      # Test fixtures embed synthetic credentials and long realistic log lines;
      # line-length and dupl style checks on them are noise.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt

issues:
  # Report everything rather than the default per-linter cap, so a contributor
  # sees the full picture in one run.
  max-issues-per-linter: 0
  max-same-issues: 0
